[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "todo"
version = "0.1.0"
description = "A small command-line todo app that stores tasks in a JSON file."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
todo = "todo.cli:main"

[tool.setuptools]
packages = ["todo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
