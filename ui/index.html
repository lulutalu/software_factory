<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Factory</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7280; --border: #e3e6eb;
    --accent: #3b5bdb; --ok: #2f9e44; --warn: #e8590c; --bad: #e03131; --idle: #adb5bd;
    --code-bg: #f1f3f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1e26; --text: #e6e8ec; --muted: #8b93a1; --border: #2a303b;
      --accent: #748ffc; --ok: #51cf66; --warn: #ff922b; --bad: #ff6b6b; --idle: #495057;
      --code-bg: #232833;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header .request { color: var(--muted); flex: 1; min-width: 200px; }
  header .meta { color: var(--muted); font-size: 12px; }
  main { padding: 20px 24px; display: grid; gap: 20px; max-width: 1400px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; }

  .steps { display: flex; gap: 0; flex-wrap: wrap; }
  .step { flex: 1; min-width: 110px; padding: 10px 12px; border: 1px solid var(--border); margin-left: -1px; text-align: center; color: var(--muted); }
  .step:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .step:last-child { border-radius: 0 6px 6px 0; }
  .step.done { color: var(--ok); }
  .step.current { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .round { margin-top: 10px; color: var(--muted); font-size: 13px; }

  .waves { display: flex; gap: 12px; overflow-x: auto; }
  .wave { min-width: 220px; flex: 1; }
  .wave h3 { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .task { border: 1px solid var(--border); border-left: 4px solid var(--idle); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
  .task.running { border-left-color: var(--accent); }
  .task.done { border-left-color: var(--ok); }
  .task.blocked { border-left-color: var(--bad); }
  .task .id { font-weight: 600; }
  .task .sub { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; }

  .reviews { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 700px) { .reviews { grid-template-columns: 1fr; } }
  .review { border: 1px solid var(--border); border-radius: 6px; padding: 12px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; background: var(--idle); color: #fff; }
  .badge.APPROVED { background: var(--ok); }
  .badge.CHANGES_REQUESTED { background: var(--bad); }
  .badge.running { background: var(--accent); }
  .counts { color: var(--muted); font-size: 12px; margin-top: 6px; }

  .viewer { display: grid; grid-template-columns: 240px 1fr; gap: 16px; min-height: 300px; }
  @media (max-width: 800px) { .viewer { grid-template-columns: 1fr; } }
  .files { border-right: 1px solid var(--border); padding-right: 12px; }
  .files button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 5px 8px; border-radius: 4px; color: var(--text); cursor: pointer; font: inherit; font-size: 13px; }
  .files button:hover { background: var(--code-bg); }
  .files button.active { background: var(--accent); color: #fff; }
  .files .fresh::after { content: " •"; color: var(--warn); }
  .doc { overflow-x: auto; }
  .doc h1, .doc h2, .doc h3, .doc h4 { margin: 1em 0 .4em; text-transform: none; letter-spacing: 0; color: var(--text); }
  .doc h1 { font-size: 18px; } .doc h2 { font-size: 16px; } .doc h3 { font-size: 14px; }
  .doc pre { background: var(--code-bg); padding: 10px; border-radius: 6px; overflow-x: auto; }
  .doc code { background: var(--code-bg); padding: 1px 4px; border-radius: 3px; font-size: 12.5px; }
  .doc pre code { background: none; padding: 0; }
  .doc .verdict-line { font-weight: 700; }
  .empty { color: var(--muted); font-style: italic; }
  .error { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>Software Factory</h1>
  <span class="request" id="request">Waiting for a run…</span>
  <span class="meta" id="meta"></span>
</header>
<main>
  <section class="panel">
    <h2>Pipeline</h2>
    <div class="steps" id="steps"></div>
    <div class="round" id="round"></div>
  </section>

  <section class="panel">
    <h2>Build: waves &amp; specialists</h2>
    <div class="waves" id="waves"><span class="empty">No plan yet.</span></div>
  </section>

  <section class="panel">
    <h2>Reviews</h2>
    <div class="reviews">
      <div class="review"><strong>Code review</strong> <span class="badge" id="v-code">—</span><div class="counts" id="c-code"></div></div>
      <div class="review"><strong>Security review</strong> <span class="badge" id="v-security">—</span><div class="counts" id="c-security"></div></div>
    </div>
  </section>

  <section class="panel">
    <h2>Files</h2>
    <div class="viewer">
      <nav class="files" id="files"><span class="empty">No files yet.</span></nav>
      <article class="doc" id="doc"><span class="empty">Select a file.</span></article>
    </div>
  </section>
</main>

<script>
"use strict";
const STEPS = [
  ["spec", "Spec"], ["plan", "Plan"], ["build", "Build"],
  ["review", "Review"], ["approval", "Your approval"], ["done", "Done"],
];
// "questions" happens inside the spec step; "setup" before it.
const STEP_ALIAS = { setup: "spec", questions: "spec" };
const $ = (id) => document.getElementById(id);
let selected = null, lastStateJson = "", fileMtimes = {}, seenMtimes = {};

function esc(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Minimal markdown: input is escaped first, then only our own tags are added (no links/raw HTML).
function renderMarkdown(src) {
  const out = []; let inCode = false, list = null;
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const inline = (t) => t
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
  for (const raw of src.split("\n")) {
    if (raw.trim().startsWith("```")) {
      closeList(); out.push(inCode ? "</code></pre>" : "<pre><code>"); inCode = !inCode; continue;
    }
    if (inCode) { out.push(esc(raw) + "\n"); continue; }
    const line = esc(raw);
    let m;
    if ((m = line.match(/^(#{1,4})\s+(.*)/))) { closeList(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); }
    else if ((m = line.match(/^\s*[-*]\s+(.*)/))) { if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); }
    else if ((m = line.match(/^\s*\d+\.\s+(.*)/))) { if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1])}</li>`); }
    else if (line.startsWith("VERDICT:")) { closeList(); out.push(`<p class="verdict-line">${line}</p>`); }
    else if (line.trim() === "") { closeList(); }
    else { closeList(); out.push(`<p>${inline(line)}</p>`); }
  }
  closeList(); if (inCode) out.push("</code></pre>");
  return out.join("");
}

function renderSteps(status) {
  const cur = status ? (STEP_ALIAS[status.step] || status.step) : null;
  const idx = STEPS.findIndex(([k]) => k === cur);
  $("steps").innerHTML = STEPS.map(([k, label], i) =>
    `<div class="step ${i < idx ? "done" : ""} ${i === idx ? "current" : ""}">${i < idx ? "✓ " : ""}${label}</div>`
  ).join("");
  if (status && status.round) {
    const extra = status.step === "questions" ? " · waiting for your answers in the terminal" :
                  status.step === "approval" ? " · waiting for your decision in the terminal" : "";
    $("round").textContent = `Round ${status.round} / ${status.max_rounds || 3}${extra}`;
  } else {
    $("round").textContent = status && status.step === "questions" ? "Waiting for your answers in the terminal" : "";
  }
}

function renderWaves(status) {
  const waves = (status && status.waves) || [];
  if (!waves.length) { $("waves").innerHTML = '<span class="empty">No plan yet.</span>'; return; }
  $("waves").innerHTML = waves.map((w) => `
    <div class="wave"><h3>Wave ${esc(String(w.wave))}</h3>
      ${(w.tasks || []).map((t) => `
        <div class="task ${esc(t.status || "pending")}">
          <div><span class="id">${esc(t.id || "")}</span> ${esc(t.title || "")}</div>
          <div class="sub"><span>${esc(t.specialist || "")}</span><span>${esc(t.status || "pending")}</span></div>
        </div>`).join("")}
    </div>`).join("");
}

async function renderReview(kind, verdict, status, files) {
  const live = status && status.reviews ? status.reviews[kind] : null;
  // Verdict line from the file wins once written; status.json tells us when it's running.
  const v = (live === "running" || live === "pending") ? live : (verdict || live || "—");
  const el = $("v-" + kind);
  el.textContent = v.replace("_", " "); el.className = "badge " + v;
  const name = kind === "code" ? "review-code.md" : "review-security.md";
  const f = files.find((x) => x.path === name);
  if (!f || v === "running") { $("c-" + kind).textContent = ""; return; }
  try {
    const text = await (await fetch("/api/file?path=" + encodeURIComponent(name))).text();
    const blocking = (text.match(/—\s*BLOCKING\s*—/g) || []).length;
    const non = (text.match(/—\s*NON-BLOCKING\s*—/g) || []).length;
    $("c-" + kind).textContent = `${blocking} blocking · ${non} non-blocking`;
  } catch { /* ignore */ }
}

function renderFiles(files) {
  if (!files.length) { $("files").innerHTML = '<span class="empty">No files yet.</span>'; return; }
  $("files").innerHTML = "";
  for (const f of files) {
    const b = document.createElement("button");
    b.textContent = f.path;
    if (f.path === selected) b.classList.add("active");
    if (seenMtimes[f.path] !== undefined && seenMtimes[f.path] !== f.mtime) b.classList.add("fresh");
    b.onclick = () => { selected = f.path; showFile(); renderFiles(files); };
    $("files").appendChild(b);
  }
}

async function showFile() {
  if (!selected) return;
  try {
    const r = await fetch("/api/file?path=" + encodeURIComponent(selected));
    if (!r.ok) { $("doc").innerHTML = '<span class="empty">File no longer exists.</span>'; return; }
    const text = await r.text();
    $("doc").innerHTML = selected.endsWith(".json") ? `<pre><code>${esc(text)}</code></pre>` : renderMarkdown(text);
    seenMtimes[selected] = fileMtimes[selected];
  } catch (e) { $("doc").innerHTML = `<span class="error">${esc(String(e))}</span>`; }
}

async function tick() {
  let state;
  try { state = await (await fetch("/api/state")).json(); }
  catch { $("meta").textContent = "server stopped"; return; }
  const json = JSON.stringify(state.status) + JSON.stringify(state.verdicts) + JSON.stringify(state.files);
  if (json === lastStateJson) return;
  lastStateJson = json;

  const s = state.status;
  $("request").textContent = s && s.request ? s.request : (state.exists ? "Run starting…" : "Waiting for a run…");
  $("meta").textContent = s && s.updated_at ? "updated " + new Date(s.updated_at).toLocaleTimeString() : "";
  renderSteps(s);
  renderWaves(s);
  for (const f of state.files) { fileMtimes[f.path] = f.mtime; if (!(f.path in seenMtimes)) seenMtimes[f.path] = f.mtime; }
  if (!selected && state.files.length) selected = (state.files.find((f) => f.path === "spec.md") || state.files[0]).path;
  renderFiles(state.files);
  if (selected) showFile();
  renderReview("code", state.verdicts.code, s, state.files);
  renderReview("security", state.verdicts.security, s, state.files);
}

tick();
setInterval(tick, 2000);
</script>
</body>
</html>
